<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>記帳(月薪版)</title>
<style>
:root{--bg:#F4F6F2;--ink:#26332B;--sub:#7A8578;--line:#E2E7E0;--green:#4A7A5C;--greensoft:#E4EEE7;--amber:#C99A3B;--ambersoft:#F5EBD6;--rose:#C96B5E;--rosesoft:#F6E4E1;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC',sans-serif;padding-bottom:60px;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--line)}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.sub{color:var(--sub)}.small{font-size:12px}.tiny{font-size:11px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:15px;background:#FBFCFA;color:var(--ink);outline:none;font-family:inherit}
button{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-ink{background:var(--ink);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-amber{background:var(--amber);color:#fff}.btn-rose{background:var(--rose);color:#fff}
.btn-ghost{background:transparent;color:var(--sub)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:10px;border-radius:5px;overflow:hidden;margin:12px 0 10px}
.bar>div{height:100%;border-radius:5px;transition:width .3s}
.tag{font-size:11px;border-radius:6px;padding:2px 6px;margin-right:6px;white-space:nowrap}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.list-row .left{min-width:0;overflow:hidden;text-overflow:ellipsis}
.x{background:var(--rosesoft);color:var(--rose);padding:0;font-size:13px;width:26px;height:26px;border-radius:50%;flex-shrink:0;font-weight:700}
.sec{font-size:13px;font-weight:700;margin:14px 0 8px}
.chip{border:1px solid var(--amber);background:#fff;color:var(--amber);padding:7px 12px;font-size:13px;border-radius:10px}
.chip.on{background:var(--amber);color:#fff}
.tabbtn{padding:5px 10px;font-size:12px;background:var(--bg);color:var(--sub)}
.tabbtn.on{background:var(--ink);color:#fff}
.notice{background:var(--ambersoft);color:#7A5E1E;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px;display:none}
.msg{max-width:82%;font-size:13px;line-height:1.6;padding:8px 12px;white-space:pre-wrap;border-radius:14px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- 週期列 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
    <button class="btn-ghost" style="font-size:20px;padding:4px 10px" onclick="nav(-1)">‹</button>
    <div style="text-align:center">
      <div id="cycTitle" style="font-size:18px;font-weight:800"></div>
      <div id="cycSub" class="small sub"></div>
    </div>
    <div style="display:flex;gap:4px">
      <button class="btn-ghost" style="font-size:20px;padding:4px 10px" onclick="nav(1)">›</button>
      <button id="gearBtn" class="btn-ghost" style="padding:4px 10px" onclick="toggleSettings()">⚙</button>
    </div>
  </div>

  <div id="notice" class="notice"></div>

  <!-- 機器人 -->
  <div class="card" style="border-top:4px solid var(--ink);padding:12px 14px">
    <div id="chatBox" style="max-height:220px;overflow-y:auto;display:none;flex-direction:column;gap:8px;margin-bottom:10px"></div>
    <div style="display:flex;gap:6px">
      <input id="chatInput" placeholder="💬 跟機器人記帳:「台新買咖啡120」" style="flex:1">
      <button class="btn-ink" onclick="chatSend()">➤</button>
    </div>
    <div id="chatHint" class="tiny sub" style="margin-top:6px;line-height:1.7">也可以:「現金午餐95」「加班3小時」「請假4小時」「剩多少?」</div>
  </div>

  <!-- 設定 -->
  <div id="settings" class="card hide" style="background:#FBFCF9">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px">基本設定</div>
    <div class="row">
      <div style="flex:1 1 70px"><div class="small sub" style="margin-bottom:4px">月薪</div><input id="setSalary" type="number" onchange="setSetting('salary',this.value)"></div>
      <div style="flex:1 1 55px"><div class="small sub" style="margin-bottom:4px">發薪日</div><input id="setPayday" type="number" onchange="setSetting('payday',this.value)"></div>
      <div style="flex:1 1 60px"><div class="small sub" style="margin-bottom:4px">加班時薪</div><input id="setOtRate" type="number" onchange="setSetting('otRate',this.value)"></div>
      <div style="flex:1 1 60px"><div class="small sub" style="margin-bottom:4px">請假扣款/時</div><input id="setLeaveRate" type="number" onchange="setSetting('leaveRate',this.value)"></div>
    </div>

    <div class="sec" style="color:#9A7B2E">我的信用卡 <span class="small sub" style="font-weight:400">(結帳日+繳款日→自動歸期)</span></div>
    <div id="cardList"></div>
    <div class="row" style="margin-top:4px">
      <input id="cardName" placeholder="卡名" style="flex:2 1 80px">
      <input id="cardClose" type="number" placeholder="結帳日" style="flex:1 1 55px">
      <input id="cardDue" type="number" placeholder="繳款日" style="flex:1 1 55px">
      <button class="btn-amber" onclick="addCard()">＋</button>
    </div>

    <div class="sec" style="color:var(--green)">固定收入 <span class="small sub" style="font-weight:400">(每期自動加進預算)</span></div>
    <div id="fincList"></div>
    <div class="row" style="margin-top:4px">
      <input id="fincName" placeholder="項目" style="flex:2 1 80px">
      <input id="fincAmt" type="number" placeholder="金額" style="flex:1 1 60px">
      <button class="btn-green" onclick="addFixedIncome()">＋</button>
    </div>

    <div class="sec" style="color:var(--rose)">分期 <span class="small sub" style="font-weight:400">(每期金額+剩幾期,繳完自動停)</span></div>
    <div id="instList"></div>
    <div class="row" style="margin-top:4px">
      <input id="instName" placeholder="名稱" style="flex:2 1 80px">
      <input id="instMonthly" type="number" placeholder="每期金額" style="flex:1 1 60px">
      <input id="instPeriods" type="number" placeholder="剩幾期" style="flex:1 1 50px">
      <button class="btn-rose" onclick="addInst()">＋</button>
    </div>

    <div class="sec" style="color:var(--rose)">固定支出 <span class="small sub" style="font-weight:400">(貸款填剩餘期數,繳完自動消失)</span></div>
    <div id="fexpList"></div>
    <div class="row" style="margin-top:4px">
      <input id="fexpName" placeholder="項目" style="flex:2 1 80px">
      <input id="fexpAmt" type="number" placeholder="每月金額" style="flex:1 1 60px">
      <input id="fexpPeriods" type="number" placeholder="剩餘期數(長期免填)" style="flex:1 1 60px">
      <button class="btn-rose" onclick="addFixedExpense()">＋</button>
    </div>

    <div class="sec">資料備份</div>
    <div class="row">
      <button class="btn-ghost" style="border:1px dashed var(--line);flex:1" onclick="exportData()">⬇ 匯出備份</button>
      <button class="btn-ghost" style="border:1px dashed var(--line);flex:1" onclick="document.getElementById('importFile').click()">⬆ 匯入備份</button>
      <input type="file" id="importFile" accept=".json" class="hide" onchange="importData(this)">
    </div>
    <div class="tiny sub" style="margin-top:6px;line-height:1.6">資料存在這支手機的瀏覽器裡。建議每月匯出一次備份檔保存。</div>
  </div>

  <!-- 薪水卡 -->
  <div class="card" style="border-top:4px solid var(--green);margin-top:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="small sub">本期預估實領(月薪+加班)</span>
      <span id="salaryBig" class="num" style="font-size:28px;color:var(--green)"></span>
    </div>
    <div class="bar" style="background:var(--line)"><div id="salaryBar" style="background:var(--green)"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:13px" class="sub">
      <span>月薪+加班 <b id="fullSalary" class="num" style="color:var(--ink)"></b><span id="salaryFormula" class="tiny"></span></span>
      <span id="leaveSummary"></span>
    </div>
    <div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:10px">
      <div id="leaveList"></div>
      <div class="row" style="margin-top:6px">
        <input id="leaveDate" placeholder="日期" style="flex:1 1 60px">
        <input id="leaveHours" type="number" placeholder="時數" style="flex:1 1 60px">
        <input id="leaveNote" placeholder="事由" style="flex:2 1 80px">
        <button class="btn-green" onclick="addLeave()">＋請假</button>
      </div>
      <div class="row" style="margin-top:6px">
        <input id="otDate" placeholder="日期" style="flex:1 1 60px">
        <input id="otHoursIn" type="number" step="0.5" placeholder="加班時數" style="flex:2 1 80px">
        <button class="btn-amber" onclick="addOvertime()">＋加班</button>
      </div>
    </div>
  </div>

  <!-- 可花的錢 -->
  <div class="card" style="border-top:4px solid var(--amber)">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="small sub">本期還可以花</span>
      <span id="remainBig" class="num" style="font-size:28px"></span>
    </div>
    <div class="bar" style="background:var(--ambersoft)"><div id="spentBar"></div></div>
    <div style="font-size:13px;line-height:1.8" class="sub">
      <div style="display:flex;justify-content:space-between"><span id="incomeLine"></span><span id="totalIncome" class="num" style="color:var(--ink)"></span></div>
      <div style="display:flex;justify-content:space-between"><span>− 固定支出 / 貸款</span><span id="fixedOut" class="num" style="color:var(--rose)"></span></div>
      <div style="display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:4px"><span>本期預算</span><span id="budgetVal" class="num" style="color:var(--ink)"></span></div>
      <div style="display:flex;justify-content:space-between"><span>已花(現金+刷卡+分期)</span><span id="spentVal" class="num" style="color:var(--ink)"></span></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div style="flex:1;background:var(--bg);border-radius:10px;padding:8px 10px;text-align:center"><div class="tiny sub">現金</div><div id="cashSpent" class="num" style="font-size:14px;color:var(--green)"></div></div>
      <div style="flex:1;background:var(--bg);border-radius:10px;padding:8px 10px;text-align:center"><div class="tiny sub">信用卡</div><div id="cardSpent" class="num" style="font-size:14px;color:var(--amber)"></div></div>
      <div style="flex:1;background:var(--bg);border-radius:10px;padding:8px 10px;text-align:center"><div class="tiny sub">分期(本期)</div><div id="instSpent" class="num" style="font-size:14px;color:var(--rose)"></div></div>
    </div>
    <div id="nextPrebooked" class="small sub" style="margin-top:8px;background:var(--bg);border-radius:8px;padding:6px 10px;display:none"></div>
    <div id="perCard" class="row" style="margin-top:8px"></div>
  </div>

  <!-- 花費 -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">
      <span style="font-size:14px;font-weight:700">花費紀錄</span>
      <div style="display:flex;gap:4px" id="tabs"></div>
    </div>

    <div id="expFormBox" style="background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px">
      <div class="row" style="margin-bottom:8px">
        <input id="expName" placeholder="項目" style="flex:2">
        <input id="expAmt" type="number" placeholder="金額" style="flex:1">
      </div>
      <div class="row" id="typeChips" style="margin-bottom:8px"></div>
      <div class="row" id="cardChips" style="margin-bottom:8px"></div>
      <div id="cycPreview" class="small" style="display:none;background:var(--ambersoft);color:#7A5E1E;border-radius:8px;padding:6px 10px;margin-bottom:8px"></div>
      <input id="expDate" type="date" style="margin-bottom:8px" onchange="updatePreview()">
      <input id="expPeriods" type="number" placeholder="分幾期?(金額填總金額)" style="margin-bottom:8px" class="hide">
      <button class="btn-ink" style="width:100%" onclick="addExpense()">記下來</button>
    </div>

    <div id="recordList"></div>
    <div id="emptyMsg" class="small sub" style="text-align:center;padding:16px 0">這一期還沒有紀錄,記第一筆吧</div>
  </div>
</div>

<script>
"use strict";
const KEY="monthly-budget-husband-v1";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nt=n=>"NT$"+Math.round(n).toLocaleString();
const pad=n=>String(n).padStart(2,"0");
const mkey=(y,m1)=>{const d=new Date(y,m1-1,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const shiftMonth=(m,dl)=>{const[y,mo]=m.split("-").map(Number);return mkey(y,mo+dl)};
const monthDiff=(a,b)=>{const[ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number);return(by-ay)*12+(bm-am)};
const cycleOfDate=(d,p)=>{const y=d.getFullYear(),m=d.getMonth()+1;return d.getDate()>=p?mkey(y,m):mkey(y,m-1)};
const todayCycle=p=>cycleOfDate(new Date(),p);
const cycleRange=(m,p)=>{const[,mo]=m.split("-").map(Number);const[,nmo]=shiftMonth(m,1).split("-").map(Number);return p<=1?mo+"/1 – "+mo+"月底":mo+"/"+p+" – "+nmo+"/"+(p-1)};
const monthLabel=m=>{const[y,mo]=m.split("-");return y+"年"+parseInt(mo)+"月期"};
const statementCycle=(iso,close,payday,due)=>{
  const[y,m,d]=iso.split("-").map(Number);let cy=y,cm=m;
  if(d>close){cm++;if(cm>12){cm=1;cy++}}
  let py=cy,pm=cm;const useDay=due||close;
  if(due&&due<=close){pm++;if(pm>12){pm=1;py++}}
  const last=new Date(py,pm,0).getDate();
  return cycleOfDate(new Date(py,pm-1,Math.min(useDay,last)),payday);
};
const todayISO=()=>{const t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())};
const shortDate=iso=>{if(!iso)return"";const p=iso.split("-");return p.length===3?parseInt(p[1])+"/"+parseInt(p[2]):iso};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const emptyMonth=()=>({leaves:[],overtimes:[],expenses:[],incomes:[]});
function prefill(){return{
  settings:{salary:40000,payday:10,otRate:250,leaveRate:170},
  cards:[],fixedIncomes:[],fixedExpenses:[],installments:[],months:{}
};}

let S; // state
try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
if(!S){S=prefill()}
S.settings=S.settings||{salary:40000,payday:10,otRate:250,leaveRate:170};
if(S.settings.otRate==null)S.settings.otRate=250;if(S.settings.leaveRate==null)S.settings.leaveRate=170;if(S.settings.salary==null)S.settings.salary=40000;
S.cards=S.cards||[];S.fixedIncomes=S.fixedIncomes||[];S.fixedExpenses=S.fixedExpenses||[];S.installments=S.installments||[];S.months=S.months||{};

let month=todayCycle(S.settings.payday||10);
let tab="all", expType="cash", expCardId=(S.cards[0]||{}).id||"";
let chatMsgs=[];

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){showNotice("⚠️ 儲存失敗:"+e.message)}}
function md(){const raw=S.months[month]||{};return{leaves:raw.leaves||[],overtimes:raw.overtimes||[],expenses:raw.expenses||[],incomes:raw.incomes||[]}}
function setMonthData(key,patch){const raw=Object.assign(emptyMonth(),S.months[key]||{});S.months[key]=Object.assign(raw,patch)}
function $(id){return document.getElementById(id)}
function showNotice(msg){const n=$("notice");n.textContent=msg;n.style.display="block";clearTimeout(showNotice.t);showNotice.t=setTimeout(()=>n.style.display="none",4500)}

function calc(){
  const s=S.settings,m=md();
  const otHours=m.overtimes.reduce((a,o)=>a+Number(o.hours||0),0);
  const otPay=otHours*s.otRate;
  const fullSalary=Number(s.salary)+otPay;
  const leaveHours=m.leaves.reduce((a,l)=>a+Number(l.hours||0),0);
  const leaveDeduct=leaveHours*s.leaveRate;
  const estSalary=Math.max(0,fullSalary-leaveDeduct);
  const fixedIncomeTotal=S.fixedIncomes.reduce((a,i)=>a+Number(i.amount||0),0);
  const fixedExpanded=S.fixedExpenses.map(f=>{
    if(f.periods){const remain=Number(f.periods)-monthDiff(f.asOfMonth||month,month);return Object.assign({},f,{remain,active:remain>=1})}
    return Object.assign({},f,{remain:null,active:true});
  });
  const fixedExpenseTotal=fixedExpanded.filter(f=>f.active).reduce((a,f)=>a+Number(f.amount||0),0);
  const extraIncome=m.incomes.reduce((a,i)=>a+Number(i.amount||0),0);
  const totalIncome=estSalary+fixedIncomeTotal+extraIncome;
  const budget=totalIncome-fixedExpenseTotal;
  const cashSpent=m.expenses.filter(e=>e.type==="cash").reduce((a,e)=>a+Number(e.amount),0);
  const cardExp=m.expenses.filter(e=>e.type==="card");
  const cardSpent=cardExp.reduce((a,e)=>a+Number(e.amount),0);
  const activeInst=S.installments.map(i=>{const k=monthDiff(i.startMonth,month);return Object.assign({},i,{currentPeriod:k+1,monthly:i.total/i.periods,active:k>=0&&k<i.periods})}).filter(i=>i.active);
  const instSpent=activeInst.reduce((a,i)=>a+i.monthly,0);
  const totalSpent=cashSpent+cardSpent+instSpent;
  const remaining=budget-totalSpent;
  const nextRaw=S.months[shiftMonth(month,1)]||{};
  const nextPre=(nextRaw.expenses||[]).reduce((a,e)=>a+Number(e.amount),0);
  return{s,m,otHours,otPay,fullSalary,leaveHours,leaveDeduct,estSalary,fixedIncomeTotal,fixedExpanded,fixedExpenseTotal,extraIncome,totalIncome,budget,cashSpent,cardExp,cardSpent,activeInst,instSpent,totalSpent,remaining,nextPre};
}
function cardById(id){return S.cards.find(c=>c.id===id)}

function render(){
  const c=calc();
  $("cycTitle").textContent=monthLabel(month);
  $("cycSub").textContent=cycleRange(month,c.s.payday)+" · "+c.s.payday+"號發薪";
  $("setSalary").value=c.s.salary;$("setPayday").value=c.s.payday;$("setOtRate").value=c.s.otRate;$("setLeaveRate").value=c.s.leaveRate;
  // 卡片/固定/分期清單
  $("cardList").innerHTML=S.cards.map(cd=>{const t=statementCycle(todayISO(),cd.closingDay,c.s.payday,cd.dueDay);return `<div class="list-row"><span class="left">${esc(cd.name)}<span class="tag" style="background:var(--ambersoft);color:#7A5E1E;margin-left:6px">${cd.closingDay}號結${cd.dueDay?" · "+cd.dueDay+"號繳":""}</span><span class="tag" style="background:var(--greensoft);color:var(--green)">今天刷→${parseInt(t.split("-")[1])}月期</span></span><button class="x" onclick="delItem('cards','${cd.id}')">✕</button></div>`}).join("");
  $("fincList").innerHTML=S.fixedIncomes.map(i=>`<div class="list-row"><span class="left">${esc(i.name)}</span><span style="display:flex;gap:8px;align-items:center"><span class="num" style="color:var(--green)">+${nt(i.amount)}</span><button class="x" onclick="delItem('fixedIncomes','${i.id}')">✕</button></span></div>`).join("");
  $("instList").innerHTML=c.activeInst.map(i=>`<div class="list-row"><span class="left">${esc(i.name)}<span class="tag" style="background:var(--rosesoft);color:var(--rose);margin-left:6px">第${i.currentPeriod}/${i.periods}期</span></span><span style="display:flex;gap:8px;align-items:center"><span class="num" style="color:var(--rose)">−${nt(i.monthly)}/期</span><button class="x" onclick="delItem('installments','${i.id}')">✕</button></span></div>`).join("");
  $("fexpList").innerHTML=c.fixedExpanded.map(f=>`<div class="list-row" style="opacity:${f.active?1:.45}"><span class="left">${esc(f.name)}${f.periods?`<span class="tag" style="background:var(--rosesoft);color:var(--rose);margin-left:6px">${f.active?"剩 "+f.remain+" 期":"已繳完"}</span>`:""}</span><span style="display:flex;gap:8px;align-items:center"><span class="num" style="color:var(--rose)">−${nt(f.amount)}</span><button class="x" onclick="delItem('fixedExpenses','${f.id}')">✕</button></span></div>`).join("");
  // 薪水
  $("salaryBig").textContent=nt(c.estSalary);
  $("salaryBar").style.width=(c.fullSalary>0?(c.estSalary/c.fullSalary)*100:100)+"%";
  $("fullSalary").textContent=nt(c.fullSalary);
  $("salaryFormula").textContent="(月薪"+nt(c.s.salary)+(c.otHours?" +加班"+c.otHours+"h "+nt(c.otPay):"")+")";
  $("leaveSummary").innerHTML="請假 "+c.leaveHours+"h <span style='color:"+(c.leaveHours?"var(--rose)":"inherit")+"'>−"+nt(c.leaveDeduct)+"</span>";
  $("leaveList").innerHTML=c.m.leaves.map(l=>`<div class="list-row" style="font-size:13px;border-bottom:none;padding:4px 0"><span class="left">${l.date?`<span class="sub" style="margin-right:6px">${esc(l.date)}</span>`:""}${esc(l.note||"請假")} ${l.hours}h</span><span style="display:flex;gap:8px;align-items:center"><span class="num" style="color:var(--rose)">−${nt(l.hours*c.s.leaveRate)}</span><button class="x" onclick="delLeave('${l.id}')">✕</button></span></div>`).join("")+c.m.overtimes.map(o=>`<div class="list-row" style="font-size:13px;border-bottom:none;padding:4px 0"><span class="left">${o.date?`<span class="sub" style="margin-right:6px">${esc(o.date)}</span>`:""}💪 加班 ${o.hours}h</span><span style="display:flex;gap:8px;align-items:center"><span class="num" style="color:var(--green)">+${nt(o.hours*c.s.otRate)}</span><button class="x" onclick="delOvertime('${o.id}')">✕</button></span></div>`).join("");
  // 可花
  $("remainBig").textContent=(c.remaining<0?"−":"")+nt(Math.abs(c.remaining));
  $("remainBig").style.color=c.remaining<0?"var(--rose)":"var(--amber)";
  const pct=c.budget>0?Math.min(100,c.totalSpent/c.budget*100):(c.totalSpent>0?100:0);
  $("spentBar").style.width=pct+"%";
  $("spentBar").style.background=pct>=90?"var(--rose)":"var(--amber)";
  $("incomeLine").innerHTML="時薪實領 + 固定收入 <b class='num' style='color:var(--green)'>+"+nt(c.fixedIncomeTotal)+"</b>"+(c.extraIncome>0?" + 臨時收入 <b class='num' style='color:var(--green)'>+"+nt(c.extraIncome)+"</b>":"");
  $("totalIncome").textContent=nt(c.totalIncome);
  $("fixedOut").textContent="−"+nt(c.fixedExpenseTotal);
  $("budgetVal").textContent=nt(c.budget);
  $("spentVal").textContent=nt(c.totalSpent);
  $("cashSpent").textContent=nt(c.cashSpent);
  $("cardSpent").textContent=nt(c.cardSpent);
  $("instSpent").textContent=nt(c.instSpent);
  const np=$("nextPrebooked");
  if(c.nextPre>0){np.style.display="block";np.innerHTML="已排到下一期的刷卡:<b class='num' style='color:var(--ink)'>"+nt(c.nextPre)+"</b>(會吃下期預算,按 › 可查看)"}else np.style.display="none";
  $("perCard").innerHTML=S.cards.map(cd=>{const t=c.cardExp.filter(e=>e.cardId===cd.id).reduce((a,e)=>a+Number(e.amount),0);return t>0?`<span class="tag" style="background:var(--ambersoft);color:#7A5E1E;padding:4px 8px;font-size:12px">${esc(cd.name)} <b class="num">${nt(t)}</b></span>`:""}).join("");
  // tabs
  $("tabs").innerHTML=[["all","全部"],["cash","現金"],["card","信用卡"],["installment","分期"],["income","收入"]].map(([k,l])=>`<button class="tabbtn ${tab===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
  // 表單 chips
  $("typeChips").innerHTML=[["cash","現金","--green"],["card","信用卡","--amber"],["installment","分期","--rose"],["income","收入","--green"]].map(([k,l,v])=>`<button class="chip ${expType===k?"on":""}" style="flex:1;border-color:var(${v});${expType===k?"background:var("+v+");color:#fff":"color:var("+v+")"}" onclick="setExpType('${k}')">${l}</button>`).join("");
  $("cardChips").innerHTML=expType==="card"?S.cards.map(cd=>`<button class="chip ${expCardId===cd.id?"on":""}" onclick="setExpCard('${cd.id}')">${esc(cd.name)} · ${cd.closingDay}號結</button>`).join(""):"";
  $("cardChips").style.display=expType==="card"?"flex":"none";
  $("expPeriods").className=expType==="installment"?"":"hide";
  $("expDate").className=expType==="installment"?"hide":"";
  if(!$("expDate").value)$("expDate").value=todayISO();
  // 紀錄
  let html="";
  if(tab==="all"||tab==="income")html+=c.m.incomes.map(i=>`<div class="list-row"><span class="left"><span class="tag" style="background:var(--greensoft);color:var(--green)">收入</span><span class="sub small" style="margin-right:6px">${shortDate(i.dateISO)}</span>${esc(i.name)}</span><span style="display:flex;gap:8px;align-items:center"><span class="num" style="color:var(--green)">+${nt(i.amount)}</span><button class="x" onclick="delIncome('${i.id}')">✕</button></span></div>`).join("");
  if(tab==="all"||tab==="installment")html+=c.activeInst.map(i=>`<div class="list-row"><span class="left"><span class="tag" style="background:var(--rosesoft);color:var(--rose)">分期 ${i.currentPeriod}/${i.periods}</span>${esc(i.name)}</span><span style="display:flex;gap:8px;align-items:center"><span style="text-align:right"><div class="num" style="color:var(--rose)">${nt(i.monthly)}<span class="tiny sub">/期</span></div><div class="tiny sub">總額 ${nt(i.total)}</div></span><button class="x" onclick="delItem('installments','${i.id}')">✕</button></span></div>`).join("");
  const vis=c.m.expenses.filter(e=>tab==="all"||e.type===tab);
  html+=vis.slice().reverse().map(e=>{
    const isCard=e.type==="card";const cd=isCard?cardById(e.cardId):null;
    const tagBg=isCard?"var(--ambersoft)":"var(--greensoft)",tagCol=isCard?"#7A5E1E":"var(--green)";
    return `<div class="list-row"><span class="left"><span class="tag" style="background:${tagBg};color:${tagCol}">${cd?esc(cd.name):(isCard?"信用卡":"現金")}</span><span class="sub small" style="margin-right:6px">${shortDate(e.dateISO)||esc(e.date||"")}</span>${esc(e.name)}</span><span style="display:flex;gap:8px;align-items:center"><span class="num">${nt(e.amount)}</span><button class="x" onclick="delExpense('${e.id}')">✕</button></span></div>`;
  }).join("");
  $("recordList").innerHTML=html;
  $("emptyMsg").style.display=html?"none":"block";
  updatePreview();
}

// ── 動作 ──
function updatePreview(){
  const box=$("cycPreview");
  if(expType!=="card"||!expCardId){box.style.display="none";return}
  const cd=cardById(expCardId);
  if(!cd){box.style.display="none";return}
  const iso=$("expDate").value||todayISO();
  const target=statementCycle(iso,cd.closingDay,S.settings.payday,cd.dueDay);
  box.style.display="block";
  box.innerHTML="📅 這筆會歸到 <b>"+monthLabel(target)+"</b>("+cycleRange(target,S.settings.payday)+" 的預算)"+(target!==month?" — 不是目前檢視的這期":"");
}
function nav(d){month=shiftMonth(month,d);render()}
function toggleSettings(){$("settings").classList.toggle("hide")}
function setTab(k){tab=k;render()}
function setExpType(k){expType=k;render()}
function setExpCard(id){expCardId=id;render()}
function setSetting(k,v){S.settings[k]=Number(v);save();render()}
function delItem(list,id){S[list]=S[list].filter(x=>x.id!==id);save();render()}
function addCard(){const n=$("cardName").value.trim(),cl=Number($("cardClose").value),du=Number($("cardDue").value);if(!n||!cl)return;const c={id:uid(),name:n,closingDay:cl};if(du)c.dueDay=du;S.cards.push(c);$("cardName").value=$("cardClose").value=$("cardDue").value="";save();render()}
function addFixedIncome(){const n=$("fincName").value.trim(),a=Number($("fincAmt").value);if(!n||!a)return;S.fixedIncomes.push({id:uid(),name:n,amount:a});$("fincName").value=$("fincAmt").value="";save();render()}
function addFixedExpense(){const n=$("fexpName").value.trim(),a=Number($("fexpAmt").value),p=Number($("fexpPeriods").value);if(!n||!a)return;const it={id:uid(),name:n,amount:a};if(p>=1){it.periods=p;it.asOfMonth=month}S.fixedExpenses.push(it);$("fexpName").value=$("fexpAmt").value=$("fexpPeriods").value="";save();render()}
function addInst(){const n=$("instName").value.trim(),mo=Number($("instMonthly").value),p=Number($("instPeriods").value);if(!mo||!p)return;S.installments.push({id:uid(),name:n||("分期(每期"+Math.round(mo)+")"),total:mo*p,periods:p,startMonth:month});$("instName").value=$("instMonthly").value=$("instPeriods").value="";save();render();showNotice("✅ 分期已建立,從本期開始每期自動攤")}
function addLeave(){const h=Number($("leaveHours").value);if(!h)return;const m=md();setMonthData(month,{leaves:m.leaves.concat([{id:uid(),date:$("leaveDate").value,hours:h,note:$("leaveNote").value}])});$("leaveDate").value=$("leaveHours").value=$("leaveNote").value="";save();render()}
function delLeave(id){setMonthData(month,{leaves:md().leaves.filter(l=>l.id!==id)});save();render()}
function addOvertime(){const h=Number($("otHoursIn").value);if(!h)return;setMonthData(month,{overtimes:md().overtimes.concat([{id:uid(),date:$("otDate").value,hours:h}])});$("otDate").value=$("otHoursIn").value="";save();render()}
function delOvertime(id){setMonthData(month,{overtimes:md().overtimes.filter(o=>o.id!==id)});save();render()}
function delExpense(id){setMonthData(month,{expenses:md().expenses.filter(e=>e.id!==id)});save();render()}
function delIncome(id){setMonthData(month,{incomes:md().incomes.filter(i=>i.id!==id)});save();render()}

function recordExpense(name,amount,type,cardId,dateISO){
  const rec={id:uid(),dateISO,name,amount:Number(amount),type,cardId:cardId||""};
  let target=month;
  const cd=cardById(cardId);
  if(type==="card"&&cd)target=statementCycle(dateISO,cd.closingDay,S.settings.payday,cd.dueDay);
  const raw=Object.assign(emptyMonth(),S.months[target]||{});
  raw.expenses=(raw.expenses||[]).concat([rec]);
  S.months[target]=raw;
  save();
  return{target,card:cd};
}

function addExpense(){
  const name=$("expName").value.trim(),amt=Number($("expAmt").value);
  if(!name||!amt)return;
  if(expType==="income"){
    const m=md();setMonthData(month,{incomes:m.incomes.concat([{id:uid(),dateISO:$("expDate").value||todayISO(),name,amount:amt}])});
    save();showNotice("💰 已記臨時收入 "+nt(amt)+",本期預算增加");
  }else if(expType==="installment"){
    const p=Number($("expPeriods").value);if(!p)return;
    S.installments.push({id:uid(),name,total:amt,periods:p,startMonth:month});save();
    showNotice("✅ 分期已建立,每期攤 "+nt(amt/p));
  }else if(expType==="card"){
    const r=recordExpense(name,amt,"card",expCardId,$("expDate").value||todayISO());
    showNotice(r.target!==month?("⚡ 依"+(r.card?r.card.name:"卡")+"結帳/繳款日,這筆歸到 "+monthLabel(r.target)):"已記入本期");
  }else{
    recordExpense(name,amt,"cash","",$("expDate").value||todayISO());
    showNotice("✅ 已記入本期");
  }
  $("expName").value=$("expAmt").value=$("expPeriods").value="";$("expDate").value=todayISO();
  render();
}

// ── 機器人(本地解析) ──
function pushMsg(role,text){
  chatMsgs.push({role,text});
  const box=$("chatBox");box.style.display="flex";$("chatHint").style.display="none";
  const d=document.createElement("div");
  d.style.cssText="display:flex;justify-content:"+(role==="user"?"flex-end":"flex-start");
  const b=document.createElement("div");
  b.className="msg";
  b.style.cssText=role==="user"?"background:var(--ink);color:#fff;border-radius:14px 14px 4px 14px":"background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px";
  b.textContent=text;
  d.appendChild(b);box.appendChild(d);box.scrollTop=box.scrollHeight;
}
function parseCardFromText(t){return S.cards.find(c=>{const n=c.name;return t.includes(n)||(n.length>=2&&t.includes(n.slice(0,2)))||(n.length>2&&t.includes(n.slice(-2)))})}
function lastClosingISO(cd){
  const t=new Date();let y=t.getFullYear(),m=t.getMonth()+1;
  if(t.getDate()<cd.closingDay){m--;if(m<1){m=12;y--}}
  const last=new Date(y,m,0).getDate();
  return y+"-"+pad(m)+"-"+pad(Math.min(cd.closingDay,last));
}
function chatSend(){
  const inp=$("chatInput");const msg=inp.value.trim();if(!msg)return;
  inp.value="";pushMsg("user",msg);
  const amt=msg.match(/(\d+(?:\.\d+)?)/);
  let reply="";
  const s=S.settings;
  if(/加班/.test(msg)){
    let hours=0;const hm=msg.match(/(\d+(?:\.\d+)?)\s*(?:小時|時|h)/i);
    if(hm)hours=parseFloat(hm[1]);else if(amt)hours=parseFloat(amt[1]);
    if(hours>0){const t=new Date();setMonthData(month,{overtimes:md().overtimes.concat([{id:uid(),date:(t.getMonth()+1)+"/"+t.getDate(),hours}])});save();render();
      reply="💪 已記加班 "+hours+" 小時,加班費 +"+nt(hours*s.otRate)+"!本期還可以花 "+remainText();}
    else reply="加班幾小時呢?例如「加班3小時」";
  }else if(/請假|病假|事假|特休/.test(msg)){
    let hours=0;const hm=msg.match(/(\d+(?:\.\d+)?)\s*(?:小時|時|h)/i);
    if(hm)hours=parseFloat(hm[1]);else if(/半天/.test(msg))hours=4;else if(/一天|1天|全天/.test(msg))hours=8;
    if(/特休/.test(msg)){reply="特休不扣薪,所以不用記 😊";}
    else if(hours>0){const t=new Date();setMonthData(month,{leaves:md().leaves.concat([{id:uid(),date:(t.getMonth()+1)+"/"+t.getDate(),hours,note:/病假/.test(msg)?"病假":"請假"}])});save();render();
      reply="🕐 已記請假 "+hours+" 小時,扣薪 "+nt(hours*s.leaveRate)+"。本期還可以花 "+remainText();}
    else reply="請假幾小時呢?例如「請假4小時」或「請假半天」";
  }else if(amt&&/收入|賺|進帳|入帳|中獎|發票中|賣掉|賣了|賣出|獎金/.test(msg)){
    const a=parseFloat(amt[1]);const note=msg.replace(/\d+(?:\.\d+)?/g,"").replace(/元|塊|錢|收入/g,"").trim().slice(0,20)||"臨時收入";
    setMonthData(month,{incomes:md().incomes.concat([{id:uid(),dateISO:todayISO(),name:note,amount:a}])});save();render();
    reply="💰 已記臨時收入 "+nt(a)+"!本期還可以花 "+remainText();
  }else if(amt&&/花|買|付|消費|吃|喝|搭|看|玩|美甲|除毛|刷|元|塊|帳單|結帳/.test(msg)){
    const a=parseFloat(amt[1]);const cd=parseCardFromText(msg);
    const note=msg.replace(/\d+(?:\.\d+)?/g,"").replace(/元|塊|錢|用|刷|付/g,"").trim().slice(0,20)||"記帳";
    const isBill=/帳單|結帳/.test(msg);
    const dateISO=(isBill&&cd)?lastClosingISO(cd):todayISO();
    const r=recordExpense(isBill&&cd?cd.name+"帳單":note,a,cd?"card":"cash",cd?cd.id:"",dateISO);
    render();
    reply=(isBill&&cd?"🧾 已記 "+cd.name+"帳單("+shortDate(dateISO)+"結帳)"+nt(a):"✅ 已記 "+nt(a)+" ["+(cd?cd.name:"現金")+"]")+(r.target!==month?",歸到 "+monthLabel(r.target)+(isBill?"(那期薪水繳)":"(下期預算)"):",歸本期")+"。本期還可以花 "+remainText();
  }else if(/剩|還可以|還能|多少|分析|狀況/.test(msg)){
    const c=calc();
    reply="📊 本期("+cycleRange(month,s.payday)+")\n預算 "+nt(c.budget)+",已花 "+nt(c.totalSpent)+"\n(現金"+nt(c.cashSpent)+" / 刷卡"+nt(c.cardSpent)+" / 分期"+nt(c.instSpent)+")\n還可以花 "+remainText()+(c.nextPre>0?"\n已排到下期的刷卡 "+nt(c.nextPre):"");
  }else{
    reply="我聽得懂這些:\n「台新買咖啡120」記刷卡\n「現金午餐95」記現金\n「賣貨便進帳500」記收入\n「加班3小時」記加班\n「請假4小時」記請假\n「剩多少?」看狀況";
  }
  pushMsg("bot",reply);
}
function remainText(){const c=calc();return(c.remaining<0?"−":"")+nt(Math.abs(c.remaining))+(c.remaining<0?"(已超支😱)":"")}
document.getElementById("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")chatSend()});

// ── 備份 ──
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="記帳備份-"+todayISO()+".json";a.click();
}
function importData(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings)throw new Error("格式不對");S=d;save();month=todayCycle(S.settings.payday||10);render();showNotice("✅ 已匯入備份")}catch(e){showNotice("⚠️ 匯入失敗:"+e.message)}};
  r.readAsText(f);
}

render();
</script>
